[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ct2us-fieldii"
version = "0.1.0"
description = "Segmentation-informed CT-to-ultrasound simulation with a Field IIpro integration point"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "nibabel>=5.2", "PyYAML>=6.0", "matplotlib>=3.8", "h5py>=3.10"]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
